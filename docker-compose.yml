services:
  postgres:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7.4.2-bookworm
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ["pnpm", "--filter", "@inbot/backend", "start:migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ["pnpm", "--filter", "@inbot/backend", "start:api"]
    environment:
      API_PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      REQUEST_BODY_LIMIT_BYTES: ${REQUEST_BODY_LIMIT_BYTES:-1048576}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      SLA_CRITICAL_THRESHOLD_PERCENT: ${SLA_CRITICAL_THRESHOLD_PERCENT:-10}
      SLA_ALERT_THRESHOLD_PERCENT: ${SLA_ALERT_THRESHOLD_PERCENT:-40}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ["pnpm", "--filter", "@inbot/backend", "start:worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-30}
      BRASIL_API_TIMEOUT_MS: ${BRASIL_API_TIMEOUT_MS:-5000}
      SLA_RETRY_ATTEMPTS: ${SLA_RETRY_ATTEMPTS:-3}
      SLA_RETRY_BACKOFF_MS: ${SLA_RETRY_BACKOFF_MS:-1000}
      HOLIDAY_CACHE_TTL_SECONDS: ${HOLIDAY_CACHE_TTL_SECONDS:-86400}
      HOLIDAY_PROVIDER_MODE: ${HOLIDAY_PROVIDER_MODE:-brasil-api}
      SLA_CRITICAL_HOURS: ${SLA_CRITICAL_HOURS:-4}
      SLA_HIGH_HOURS: ${SLA_HIGH_HOURS:-8}
      SLA_MEDIUM_HOURS: ${SLA_MEDIUM_HOURS:-24}
      SLA_LOW_HOURS: ${SLA_LOW_HOURS:-48}
      SLA_CRITICAL_THRESHOLD_PERCENT: ${SLA_CRITICAL_THRESHOLD_PERCENT:-10}
      SLA_ALERT_THRESHOLD_PERCENT: ${SLA_ALERT_THRESHOLD_PERCENT:-40}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
